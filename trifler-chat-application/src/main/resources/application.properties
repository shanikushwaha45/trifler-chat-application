spring.application.name=trifler-chat-application


server.port=4000

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/trifler
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View
spring.jpa.open-in-view=false

# WebSocket
# Endpoint and broker destinations will be configured in WebSocketConfig.java

# Logging
logging.level.com.trifler.chatapplication=DEBUG
logging.level.org.springframework.web.socket=INFO

